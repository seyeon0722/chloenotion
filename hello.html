<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hello</title>
<!--
  chloe-hello.html — minimal monochrome greeting + clock widget for Notion /embed
  Fonts: Lyon Text if installed (Notion's serif), otherwise Source Serif 4 from Google Fonts.
  No tracking, no other scripts. Click the greeting, name or quote to edit; ••• (on hover) for settings.
  Edits are saved in this browser only (localStorage).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
<script>
/* ======================================================================
   CONFIG — defaults. Changes made in the widget override these
   (in this browser) until you press Reset.
   ====================================================================== */
const CONFIG = {
  name: "chloe",
  greetings: {
    morning:   "good morning",     //  5:00 – 11:59
    afternoon: "good afternoon",   // 12:00 – 16:59
    evening:   "good evening",     // 17:00 – 20:59
    night:     "good night"        // 21:00 –  4:59
  },
  quotes: [
    "movement is a privilege",
    "fear eats the soul",
    "inspired by the fear of being average",
    "a closed mouth doesn't get fed",
    "discipline is a love letter to your future self",
    "quiet work, loud results"
  ],
  clock: "12",                     // "12" or "24"
  rotate: "daily",                 // "daily" | "visit" | "tap" (press ↻ on the quote to change)
  showIndex: true                  // the small "Nº 46" week-number mark
};
/* ====================================================================== */
</script>
<style>
:root{
  --ink:#f2f2f2; --soft:rgba(242,242,242,.62); --mute:rgba(242,242,242,.4); --hair:rgba(255,255,255,.08);
  --card:#161616; --panel:#202020;
  /* Notion's Serif option is Lyon Text (commercial, not bundled). Used if installed; else Source Serif 4. */
  --serif:"Lyon-Text","Lyon Text","Source Serif 4",Georgia,ui-serif,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:12px;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}

/* ---------- card: flat, hairline only ---------- */
.card{position:relative;max-width:880px;margin:0 auto;border-radius:20px;background:var(--card);border:1px solid var(--hair);container-type:inline-size}
.pad{padding:clamp(20px,4.6cqi,38px) clamp(22px,5.6cqi,48px) clamp(20px,4.6cqi,38px)}

/* ---------- top ---------- */
.mast{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.hello{font:400 clamp(24px,4.6cqi,36px)/1.15 var(--serif);letter-spacing:-.012em;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.hello span[contenteditable]{padding:0 2px}
.hello .comma{margin-left:-2px}
.idx{font:italic 400 clamp(14px,2cqi,16px)/1 var(--serif);color:var(--mute);white-space:nowrap;margin-right:34px}
.idx b{font-style:normal;font-weight:600;color:var(--soft)}

/* ---------- clock ---------- */
.row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px 24px;margin-top:clamp(8px,2cqi,16px)}
.clock{display:flex;align-items:flex-start;font:500 clamp(64px,14.5cqi,124px)/.9 var(--serif);font-optical-sizing:auto;letter-spacing:-.025em;
  font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;margin-left:-.04em}
.clock .c{color:var(--mute);margin:0 .01em;animation:breathe 4s ease-in-out infinite}
.clock .ap{font:italic 400 clamp(15px,2.4cqi,20px)/1 var(--serif);color:var(--soft);margin:.45em 0 0 .6em}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- date ---------- */
.dateline{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:8px;padding-bottom:.55em}
.dateline .wd{font:400 clamp(18px,2.9cqi,23px)/1 var(--serif);color:var(--ink)}
.dateline .md{font:400 clamp(13px,2cqi,15px)/1 var(--serif);color:var(--mute)}
.rule{height:1px;background:var(--hair);margin:clamp(16px,3cqi,24px) 0 0}

/* ---------- quote: flat panel ---------- */
.quote{position:relative;margin-top:clamp(14px,2.8cqi,22px);padding:clamp(14px,2.4cqi,18px) 48px clamp(14px,2.4cqi,18px) clamp(16px,2.8cqi,22px);
  background:var(--panel);border-radius:12px}
.q{font:italic 400 clamp(16px,2.6cqi,20px)/1.4 var(--serif);color:var(--ink);padding:0 2px}
.again{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mute);width:28px;height:28px;border-radius:50%;
  cursor:pointer;font:15px/1 var(--serif);opacity:0;transition:opacity .25s,color .2s,transform .5s}
.quote:hover .again,.again:focus-visible{opacity:1}
.again:hover{color:var(--ink);transform:translateY(-50%) rotate(180deg)}
@media (hover:none){.again{opacity:.6}}

/* ---------- click-to-edit (invisible until hover) ---------- */
[contenteditable]{outline:none;border-radius:6px;cursor:text;transition:background .2s}
[contenteditable]:hover{background:rgba(255,255,255,.045)}
[contenteditable]:focus{background:rgba(255,255,255,.07)}
.quote [contenteditable]:hover{background:rgba(255,255,255,.04)}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.45}

.menu{position:absolute;top:clamp(14px,3.6cqi,30px);right:clamp(14px,3.6cqi,30px);z-index:3;border:1px solid transparent;background:transparent;color:var(--mute);
  width:30px;height:22px;border-radius:11px;font:600 12px/1 system-ui,sans-serif;letter-spacing:1px;cursor:pointer;opacity:0;transition:color .2s,border-color .2s,opacity .25s}
.card:hover .menu,.menu.on,.menu:focus-visible{opacity:1}
@media (hover:none){.menu{opacity:.55}}
.menu:hover,.menu.on{color:var(--ink);border-color:var(--hair)}
.menu:focus-visible{border-color:rgba(255,255,255,.3);outline:none}

/* ---------- entrance ---------- */
.rise{opacity:0;transform:translateY(6px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.45s}
@keyframes rise{to{opacity:1;transform:none}}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.clock .c,.fade{animation:none}}

/* ---------- settings ---------- */
.cfg .title{font:700 clamp(24px,4cqi,30px)/1.1 var(--serif);letter-spacing:-.012em;margin:0 0 4px}
.cfg .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
@container (max-width:540px){.cfg .grid{grid-template-columns:1fr}}
.cfg label{display:block;font:600 13.5px/1 var(--serif);color:var(--soft);margin:16px 0 7px}
.cfg .opts{display:flex;flex-wrap:wrap;gap:0 18px}
.cfg input[type=text],.cfg textarea{width:100%;background:var(--panel);border:1px solid transparent;border-radius:10px;color:var(--ink);
  padding:9px 12px;font:400 15.5px/1.4 var(--serif);outline:none;transition:border-color .2s}
.cfg textarea{min-height:150px;resize:vertical}
.cfg input:focus,.cfg textarea:focus{border-color:rgba(255,255,255,.25)}
.cfg .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--soft);font:400 14px/1 var(--serif);padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#161616}
.foot{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--ink);font:600 14px/1 var(--serif);padding:10px 18px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:rgba(255,255,255,.35)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#161616}
.btn.solid:hover{background:#fff}
.ghost{margin-left:auto;border:0;background:none;color:var(--mute);font:italic 400 14.5px var(--serif);cursor:pointer}
.ghost:hover{color:var(--ink)}
.hint{font:italic 400 14px/1.45 var(--serif);color:var(--mute);margin-top:12px}

/* ---------- narrow ---------- */
@container (max-width:520px){
  .row{display:block}
  .dateline{flex-direction:row;align-items:baseline;justify-content:space-between;text-align:left;margin-top:clamp(12px,3cqi,16px);padding:0}
}
@container (max-width:460px){
  .clock{font-size:clamp(58px,25cqi,112px)}
  .clock .ap{font:italic 400 clamp(15px,2.4cqi,20px)/1 var(--serif);color:var(--soft);margin:.45em 0 0 .6em}
  .idx{font:italic 400 clamp(14px,2cqi,16px)/1 var(--serif);color:var(--mute);white-space:nowrap;margin-right:34px}
  .quote{padding-right:40px}
}
</style>

</head>
<body>
<div class="card" id="card">
  <button class="menu" id="menu" aria-label="Settings" title="settings">•••</button>
  <div class="pad">
    <div id="view">
      <div class="mast rise d1">
        <div class="hello"><span id="greet" contenteditable="plaintext-only" spellcheck="false" data-ph="hello"></span><span class="comma">,</span> <span id="name" contenteditable="plaintext-only" spellcheck="false" data-ph="name"></span></div>
        <span class="idx" id="idx">week <b id="wk">46</b></span>
      </div>
      <div class="row">
        <div class="clock rise d3" id="clock" aria-live="off"><span id="hh"></span><span class="c">:</span><span id="mm"></span><span class="ap" id="ap"></span></div>
        <div class="dateline rise d4" id="dateline"></div>
      </div>
      <div class="rule rise d4"></div>
      <div class="quote rise d5" id="quote">
        <div class="q fade" id="q" contenteditable="plaintext-only" spellcheck="false" data-ph="a line for today"></div>
        <button class="again" id="again" aria-label="Next quote" title="next quote">↻</button>
      </div>
    </div>
    <div class="cfg" id="cfg" hidden></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const KEY = "chloe_hello_v4";
  const PERIODS = ["morning","afternoon","evening","night"];
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };

  let saved = load(), S = merge();
  function merge(){
    const s = Object.assign(clone(CONFIG), clone(saved));
    s.greetings = Object.assign(clone(CONFIG.greetings), saved.greetings || {});
    if (!Array.isArray(s.quotes)) s.quotes = clone(CONFIG.quotes);
    return s;
  }
  function set(patch){ Object.assign(saved, patch); try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} S = merge(); }

  const urlName = new URLSearchParams(location.search).get("name");
  if (urlName && saved.name == null) S.name = urlName.slice(0, 40);

  const visitSeed = Math.floor(Math.random() * 997);
  let bump = 0, lastQ = null;

  const period = h => h >= 5 && h < 12 ? "morning" : h >= 12 && h < 17 ? "afternoon" : h >= 17 && h < 21 ? "evening" : "night";
  function isoWeek(d){
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
    return Math.ceil(((x - Date.UTC(x.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }
  function quoteIndex(d){
    const n = S.quotes.length; if (!n) return -1;
    const base = S.rotate === "tap" ? (saved.qi || 0) : S.rotate === "visit" ? visitSeed
               : Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    return ((base + bump) % n + n) % n;
  }
  const put = (el, t) => { if (document.activeElement !== el && el.textContent !== t) el.textContent = t; };

  function render(){
    const d = new Date(), h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, "0");
    if (S.clock === "24"){ $("#hh").textContent = String(h).padStart(2, "0"); $("#ap").textContent = ""; }
    else { $("#hh").textContent = String(h % 12 || 12); $("#ap").textContent = h >= 12 ? "pm" : "am"; }
    $("#mm").textContent = m;
    $("#ap").hidden = S.clock === "24";

    const wd = d.toLocaleDateString("en-US", {weekday: "long"});
    const md = d.toLocaleDateString("en-US", {month: "long", day: "numeric", year: "numeric"});
    $("#dateline").innerHTML = '<span class="wd">' + esc(wd.toLowerCase()) + "</span><span class=\"md\">" + esc(md) + "</span>";
    $("#wk").textContent = isoWeek(d);
    $("#idx").hidden = !S.showIndex;

    put($("#greet"), S.greetings[period(h)]);
    put($("#name"), S.name);
    const i = quoteIndex(d), q = i < 0 ? "" : S.quotes[i], el = $("#q");
    if (q !== lastQ && document.activeElement !== el){
      el.textContent = q; el.dataset.i = i;
      el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); lastQ = q;
    }
    $("#again").hidden = S.quotes.length < 2;
  }

  // ---- click-to-edit ----
  function editable(el, commit){
    el.addEventListener("keydown", e => {
      if (e.key === "Enter"){ e.preventDefault(); el.blur(); }
      if (e.key === "Escape"){ el.dataset.cancel = "1"; el.blur(); }
    });
    el.addEventListener("paste", e => {
      e.preventDefault();
      document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " "));
    });
    el.addEventListener("blur", () => {
      if (el.dataset.cancel){ delete el.dataset.cancel; el.textContent = ""; }
      else commit(el.textContent.replace(/\s+/g, " ").trim());
      lastQ = null; render();
    });
  }
  editable($("#greet"), t => { const p = period(new Date().getHours()); set({greetings: Object.assign({}, saved.greetings, {[p]: t || CONFIG.greetings[p]})}); });
  editable($("#name"), t => set({name: t}));
  editable($("#q"), t => {
    const qs = S.quotes.slice(), i = +$("#q").dataset.i;
    if (i >= 0 && i < qs.length){ if (t) qs[i] = t; else qs.splice(i, 1); } else if (t) qs.push(t);
    set({quotes: qs});
  });
  $("#again").addEventListener("click", () => {
    if (S.rotate === "tap") set({qi: ((saved.qi || 0) + 1) % Math.max(1, S.quotes.length)}); else bump++;
    render();
  });

  // ---- settings ----
  const seg = (k, opts) => '<div class="seg" data-k="' + k + '">' + opts.map(([v, l]) =>
    '<button type="button" class="' + (String(S[k]) === v ? "on" : "") + '" data-v="' + v + '">' + l + "</button>").join("") + "</div>";
  function openCfg(){
    const p = $("#cfg");
    if (!p.hidden){ closeCfg(); return; }
    p.innerHTML = '<div class="title">make it yours</div><div class="grid"><div>' +
      '<label for="c-name">name</label><input id="c-name" type="text" maxlength="40" value="' + esc(S.name) + '">' +
      '<label>greetings</label><div class="two">' + PERIODS.map(k =>
        '<input type="text" data-g="' + k + '" placeholder="' + k + '" title="' + k + '" value="' + esc(S.greetings[k]) + '">').join("") + "</div>" +
      '<div class="opts"><div>' + "<label>clock</label>" + seg("clock", [["12","12h"],["24","24h"]]) + "</div><div>" +
      "<label>new quote</label>" + seg("rotate", [["daily","daily"],["visit","each visit"],["tap","on tap"]]) + "</div></div>" +
      "<label>week mark</label>" + seg("showIndex", [["true","show"],["false","hide"]]) +
      '</div><div><label for="c-q">quotes — one per line</label><textarea id="c-q" rows="8">' + esc(S.quotes.join("\n")) + "</textarea>" +
      '<div class="hint">tip — you can also click the greeting, the name or the quote to edit it in place. saved in this browser only.</div></div></div>' +
      '<div class="foot"><button class="btn solid" id="c-save">save</button><button class="btn" id="c-cancel">cancel</button>' +
      '<button class="ghost" id="c-reset">reset to defaults</button></div>';
    const tmp = {clock: S.clock, rotate: S.rotate, showIndex: String(S.showIndex)};
    p.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.onclick = () => {
      tmp[sg.dataset.k] = b.dataset.v; sg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    }));
    $("#c-save").onclick = () => {
      const greetings = {};
      p.querySelectorAll("[data-g]").forEach(i => greetings[i.dataset.g] = i.value.trim() || CONFIG.greetings[i.dataset.g]);
      set({clock: tmp.clock, rotate: tmp.rotate, showIndex: tmp.showIndex === "true", name: $("#c-name").value.trim(), greetings,
        quotes: $("#c-q").value.split("\n").map(s => s.trim()).filter(Boolean)});
      lastQ = null; closeCfg();
    };
    $("#c-cancel").onclick = closeCfg;
    let armed = false;
    $("#c-reset").onclick = e => {
      if (!armed){ armed = true; e.target.textContent = "tap again to reset"; setTimeout(() => { armed = false; if (e.target.isConnected) e.target.textContent = "reset to defaults"; }, 2500); return; }
      try { localStorage.removeItem(KEY); } catch (err) {}
      saved = {}; S = merge(); bump = 0; lastQ = null; closeCfg();
    };
    $("#view").hidden = true; p.hidden = false; $("#menu").classList.add("on");
  }
  function closeCfg(){ $("#cfg").hidden = true; $("#cfg").innerHTML = ""; $("#view").hidden = false; $("#menu").classList.remove("on"); render(); }
  $("#menu").addEventListener("click", openCfg);

  window.addEventListener("storage", e => { if (e.key === KEY){ saved = load(); S = merge(); lastQ = null; render(); } });
  render();
  setTimeout(function tick(){ render(); setTimeout(tick, 60000 - Date.now() % 60000 + 50); }, 60000 - Date.now() % 60000 + 50);
})();
</script>
</body>
</html>
